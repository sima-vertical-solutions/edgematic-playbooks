id: edgematic-ros-capabilities
name: EdgeMatic ROS Workspace Capabilities
version: 0.1.0
agents: [codex, claude]
description: Clone the client repository and sima-core into one parent directory with clone_repository, open that parent as a host ROS 2 colcon workspace in EdgeMatic Studio, read and change which capabilities its bringup package builds with, prepare the build — which Studio starts itself where a build channel is configured, and otherwise hands to the user as a command to run — and deploy it — via the clone_repository / open_ros_workspace / list_ros_capabilities / set_ros_capabilities / prepare_ros_build / cancel_ros_build agent tools. Covers why the clone goes through clone_repository rather than an improvised shell command (the credential never reaches the repository config, and the Git-LFS filters keep the robot meshes from arriving as pointer files), the exec_depend-only selection rule, completing the workspace's declared third-party sources with pinned revisions before building (cloning the two repositories is not enough), naming the build script explicitly because there is no default, why the workspace's own build script is the only supported entry point, and how to read an unconfirmed build.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.0
