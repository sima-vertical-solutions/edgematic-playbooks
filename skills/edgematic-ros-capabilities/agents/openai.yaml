interface:
  display_name: "Edgematic ROS Workspace Capabilities"
  short_description: "Clone the ROS repositories, select capabilities, prepare the build, and deploy — from chat"
  default_prompt: "Use $edgematic-ros-capabilities to set up and work on a host ROS 2 workspace — clone the client repository and sima-core into one shared parent directory with clone_repository (never an improvised shell clone: it would put the token in the repository config and drop the Git-LFS filters, leaving pointer files where the robot meshes belong), open that same parent (open_ros_workspace), list and change which capabilities the bringup package builds with (list_ros_capabilities / set_ros_capabilities), prepare the build — Studio starts it itself where a build channel is configured, and otherwise hands the user the command to run, so read run_on from the result to know which (prepare_ros_build) — release the row again if the build is declined, refused or abandoned (cancel_ros_build), then watch it and deploy."
