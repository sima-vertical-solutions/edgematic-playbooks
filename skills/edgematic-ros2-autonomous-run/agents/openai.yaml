interface:
  display_name: "Edgematic ROS 2 Autonomous Run"
  short_description: "Run a ROS 2 pipeline on the DevKit end to end — input, build, deploy, launch and view, decided from the code"
  default_prompt: "Use $edgematic-ros2-autonomous-run to take a ROS 2 pipeline all the way to visible output on a paired DevKit without stopping to ask: establish whether this deployment has the ready-made catalogue or is on the portable path and say which, obtain the sources, then READ THE APPLICATION CODE for the four things that decide the run — the input geometry and frame rate it was built for, the params it reads for its source and sink, the topics it publishes and their message types, and what its model and labels mean the input must contain. Provision that input yourself (reuse a library asset, else fetch and transcode one, else assemble a dataset's frames into a stream), rewrite both copies of the params with the URL and geometry together, cross-compile in the ROS 2 SDK container, deploy to a directory the SSH user owns, clear prior deployments from every path, launch detached and start the bridge last, then verify against the topics you derived — not a remembered list — before reporting success. Ask only for a paired device, the board credential once, a standing reboot policy, and (only if they arise) whether to build on the device when the container is missing or for an archive that sits behind a login."
