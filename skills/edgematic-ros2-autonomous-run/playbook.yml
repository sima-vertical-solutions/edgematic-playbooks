id: edgematic-ros2-autonomous-run
name: Edgematic ROS 2 Autonomous Run
version: 0.2.0
agents: [codex, claude]
description: Get a ROS 2 pipeline running on a Modalix DevKit end to end from a one-sentence request with minimal back-and-forth — resolve the named device and check it is online, establish which of the two ROS 2 paths the deployment is on, obtain the sources, read the application's own code for the input geometry it requires, the params it reads and the topics it publishes, provision that input automatically (library asset, URL, or a research dataset assembled into a stream) at an address proven reachable from the board, then build (or adopt a deployment the user names), deploy, launch, verify against the derived topics, show the output and leave it running; asking only for the device and the board credential once, and never rebooting without a standing rule.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.0
