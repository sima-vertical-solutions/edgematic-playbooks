id: edgematic-ros2-autonomous-run
name: Edgematic ROS 2 Autonomous Run
version: 0.3.5
agents: [codex, claude]
description: Get an otherwise-unclassified ROS 2 pipeline request running on a Modalix DevKit end to end from one sentence with minimal back-and-forth; route new package generation from contract files to edgematic-ros2-contract-builder, standard demos to edgematic-ros2-demo, and existing packages to edgematic-ros2-user-package.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.0
