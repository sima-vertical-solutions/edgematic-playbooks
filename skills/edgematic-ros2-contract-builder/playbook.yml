id: edgematic-ros2-contract-builder
name: Edgematic ROS 2 Contract Builder
version: 0.3.0
agents: [codex, claude]
description: Generate a new ROS 2 package from a prompt and robot contract, including a URDF-only ROSBOT XL profile, then build, deploy, and verify rosbag or managed-RTSP input, detections, overlay, and a read-only operator TUI.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.0
