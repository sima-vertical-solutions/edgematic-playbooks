id: edgematic-ros2-legacy-vdp-port
name: Edgematic ROS 2 Legacy vdp-simaai-ros2 Port
version: 0.2.0
agents: [codex, claude]
description: Cross-compile a package from the legacy vdp-simaai-ros2 client repository for a Modalix DevKit and port its develop-branch sources onto the board's current Neat runtime — the bringup package colcon expects beside sima-core, and the six runtime fixes of which only one is a compile error, and finding the tree the build actually compiles before editing any of it — so a green build proves cross-compilation and not correctness, and on the wrong tree not even that.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.0
