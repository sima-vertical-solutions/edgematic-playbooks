id: edgematic-view-streams
name: Edgematic View Streams
version: 0.1.0
agents: [codex, claude]
description: Show the active live video streams inline in the Edgematic Studio chat — count how many are live and emit the standard streams block so the UI renders a compact multi-stream grid as the last message (re-shown on reload or in a new chat, and poppable into the workspace). Invoked unprompted as the closing step of every video deploy, as well as on request.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.0
