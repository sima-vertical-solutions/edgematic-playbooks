interface:
  display_name: "Edgematic ROS 2 Portable Pipeline"
  short_description: "Build, deploy and run the user's own ROS 2 pipeline on a DevKit — no client repository required"
  default_prompt: "Use $edgematic-ros2-portable-pipeline to get a ROS 2 pipeline the user owns running on a paired DevKit — lay the workspace out with sima-core beside the user's own package and a bringup package under src/, open it (open_ros_workspace), cross-compile it in the ROS 2 SDK container (prepare_ros_build, naming the build script by its bare filename, after the user has made it executable), deploy it to a directory the SSH user owns with the board's real ROS domain id (deploy_to_device), have the user check the MLA is free and its shared memory is live before every run, launch it detached with the environment set explicitly rather than by sourcing the deployed setup script, then confirm it is really running from a second session and show the output (count_streams / list_output_streams)."
