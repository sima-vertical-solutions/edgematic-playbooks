id: edgematic-ros2-host-container
name: Edgematic ROS2 Host Container (install and provision)
version: 0.2.0
agents: [codex, claude]
description: Get the ROS 2 SDK container onto native ARM64 or emulated AMD64 and make it able to build — preferring the Edgematic installer's ROS option, then provisioning sima-core and its build channel in the shared workspace.
compatibility:
  env_types: [host, sdk]
  min_cli_version: 2.1.16
